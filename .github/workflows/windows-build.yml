name: TrafficSignalStudio Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: traffic-signal-studio-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke-test GUI startup
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -c "from PySide6.QtWidgets import QApplication; from main_window import MainWindow; app = QApplication([]); window = MainWindow(); print('GUI startup OK'); window.close()"

      - name: Build Windows application
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --name TrafficSignalStudio
          --collect-all PySide6
          --hidden-import requests
          main.py

      - name: Upload Windows EXE and support files
        uses: actions/upload-artifact@v4
        with:
          name: TrafficSignalStudio-Windows
          path: dist/TrafficSignalStudio/
          if-no-files-found: error
          retention-days: 14
