
name: TrafficSignalStudio Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "TrafficSignalStudio_GitHub_Import.zip" -DestinationPath "." -Force

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r TrafficSignalStudio/requirements.txt

      - name: Run tests
        run: python -m pytest -q TrafficSignalStudio/tests

      - name: Build EXE
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --name TrafficSignalStudio
          --paths TrafficSignalStudio
          TrafficSignalStudio/app/main.py

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TrafficSignalStudio-Windows
          path: dist/TrafficSignalStudio/
