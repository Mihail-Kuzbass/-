name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r TrafficSignalStudio/requirements.txt
      - name: Run tests
        run: python -m pytest -q TrafficSignalStudio/tests
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --windowed --name TrafficSignalStudio --paths TrafficSignalStudio TrafficSignalStudio/app/main.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: TrafficSignalStudio-Windows
          path: dist/TrafficSignalStudio/
